<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>ImmerseFree</title>
  <link rel="stylesheet" href="../Style.css">
  <script src="../Script.js" defer></script>
</head>
<body>
  <img src="../Icon.png" width="112" height="112" alt="ImmerseFree 圖示">
  <h1>ImmerseFree</h1>
  <p class="state-unknown">請在 Safari 的延伸功能設定中開啟 ImmerseFree。</p>
  <p class="state-on">Safari 延伸功能已開啟。</p>
  <p class="state-off">Safari 延伸功能目前未開啟。</p>
  <button class="open-preferences">開啟 Safari 延伸功能設定</button>
</body>
</html>
